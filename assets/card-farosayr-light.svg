<svg width="410" height="196" viewBox="0 0 410 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Farosayr — Travel Agency Platform">
  <defs>
    <radialGradient id="farosayr-glow-light" cx="92%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0" />
    </radialGradient>
    <clipPath id="farosayr-clip-light">
      <rect x="0.5" y="0.5" width="409" height="195" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#farosayr-clip-light)">
    <rect x="0.5" y="0.5" width="409" height="195" rx="12" fill="#F8FAFC" />
    <rect x="0" y="0" width="410" height="196" fill="url(#farosayr-glow-light)" />

    <!-- Top Status Row -->
    <rect x="22" y="20" width="128" height="22" rx="11" fill="#DCFCE7" stroke="#16A34A" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="34" cy="31" r="3" fill="#16A34A" />
    <text x="44" y="34.5" fill="#15803D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.4">LIVE PRODUCTION</text>

    <text x="388" y="34.5" text-anchor="end" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">farosayr.com ↗</text>

    <!-- Title & Subtitle -->
    <text x="22" y="74" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">Farosayr</text>
    <text x="22" y="94" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Travel Agency Platform · Dushanbe</text>

    <!-- Description -->
    <text x="22" y="120" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Client website, REST API, and Telegram bot</text>
    <text x="22" y="138" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">built &amp; deployed for a real travel business.</text>

    <!-- Tech Pills -->
    <g transform="translate(22, 156)">
      <rect x="0" y="0" width="66" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="33" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">React 19</text>

      <rect x="73" y="0" width="48" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="97" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Vite</text>

      <rect x="128" y="0" width="66" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="161" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Express</text>

      <rect x="201" y="0" width="84" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="243" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">PostgreSQL</text>

      <rect x="292" y="0" width="58" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="321" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">TG Bot</text>
