      <rect x="69" y="0" width="78" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="108" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">TypeScript</text>

      <rect x="154" y="0" width="58" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="183" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">NestJS</text>

      <rect x="219" y="0" width="82" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
      <text x="260" y="14.5" text-anchor="middle" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">PostgreSQL</text>

