<svg width="410" height="196" viewBox="0 0 410 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faroz — Adaptive Learning Platform">
  <defs>
    <radialGradient id="faroz-glow-light" cx="92%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <clipPath id="faroz-clip-light">
      <rect x="0.5" y="0.5" width="409" height="195" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#faroz-clip-light)">
    <rect x="0.5" y="0.5" width="409" height="195" rx="12" fill="#F8FAFC" />
    <rect x="0" y="0" width="410" height="196" fill="url(#faroz-glow-light)" />

    <!-- Top Status Row -->
    <rect x="22" y="20" width="168" height="22" rx="11" fill="#E0F2FE" stroke="#0284C7" stroke-opacity="0.32" stroke-width="1" />
    <circle cx="34" cy="31" r="3" fill="#0284C7" />
    <text x="44" y="34.5" fill="#0369A1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.4">EDTECH · RU / TJ / EN</text>

    <text x="388" y="34.5" text-anchor="end" fill="#0284C7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500">GitHub ↗</text>

    <!-- Title & Subtitle -->
    <text x="22" y="74" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">Faroz</text>
    <text x="22" y="94" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Adaptive Learning Platform · Monorepo</text>

