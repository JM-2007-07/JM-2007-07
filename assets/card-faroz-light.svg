    <text x="22" y="138" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">with learner, teacher, and center workspaces.</text>

    <!-- Tech Pills -->
    <g transform="translate(22, 156)">
      <rect x="0" y="0" width="62" height="22" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1" />
